<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Car Dealership Manager Tycoon</title>
<style>
:root{--bg:#0b0d10;--panel:#12161c;--panel2:#181e26;--line:#2a323d;--text:#eef2f6;--muted:#8d98a6;--accent:#f0b90b;--good:#38d996;--bad:#ff6574;--blue:#5ea7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#202831 0,#0b0d10 42%);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;background:#252d37;color:var(--text);cursor:pointer;min-height:42px}button:hover{background:#303a47}button.primary{background:var(--accent);color:#111;font-weight:800}button.good{background:#183e31;color:#65f0b0}button.danger{background:#4b2028;color:#ff9aa5}button:disabled{opacity:.45;cursor:not-allowed}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:#0e1116;padding:18px;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:17px;margin-bottom:4px}.sub{color:var(--muted);font-size:11px;margin-bottom:18px}.nav{display:grid;gap:6px}.nav button{text-align:left;background:transparent;color:#aeb8c4}.nav button.active{background:#242a32;color:#fff;border-left:3px solid var(--accent)}.side .save{position:absolute;bottom:18px;left:18px;right:18px;display:grid;gap:7px}.main{min-width:0;padding:20px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.title h1{margin:0;font-size:25px}.title p{margin:4px 0;color:var(--muted)}.cash{font-size:20px;font-weight:900}.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:22px;font-weight:900;margin-top:5px}.goodtxt{color:var(--good)}.badtxt{color:var(--bad)}.muted{color:var(--muted)}.section{margin:18px 0 8px;font-weight:900;font-size:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{background:#0e1217;border:1px solid var(--line);color:#fff;border-radius:9px;padding:10px 12px;min-height:42px}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:11px;background:#10151b}.row .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.vehicle{display:grid;grid-template-columns:1fr auto;gap:12px}.vehicle h3{margin:0 0 3px}.tag{display:inline-block;border:1px solid #394451;border-radius:999px;padding:3px 7px;color:#b8c3cf;font-size:11px;margin:2px 3px 2px 0}.price{font-size:18px;font-weight:900}.bar{height:8px;border-radius:99px;background:#252c35;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11px;text-transform:uppercase}.notice{padding:12px;border-radius:10px;background:#19212b;border:1px solid #2d3a48}.event{border-left:3px solid var(--accent)}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:10}.modalbox{width:min(680px,100%);max-height:90vh;overflow:auto;background:#12171e;border:1px solid #36414e;border-radius:16px;padding:18px}.hide{display:none!important}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:14px}.tabs button{white-space:nowrap}.mobilebar{display:none}.small{font-size:12px}.kpi{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.spark{height:80px;display:flex;align-items:end;gap:4px}.spark i{flex:1;background:#5ea7ff55;border:1px solid #5ea7ff88;border-bottom:0;border-radius:4px 4px 0 0;min-height:5px}.dealbox{border:1px solid #43505f;background:#0e1319;border-radius:12px;padding:14px}.offer{font-size:28px;font-weight:900}.toast{position:fixed;right:18px;bottom:18px;background:#f4f7fa;color:#0d1116;padding:12px 15px;border-radius:10px;font-weight:700;z-index:20;box-shadow:0 10px 30px #0006}.dangerline{border:1px solid #5b2932;background:#211317}.successline{border:1px solid #285843;background:#11221c}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:14px 12px 90px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}.mobilebar{display:grid;position:fixed;z-index:8;bottom:0;left:0;right:0;background:#0d1116;border-top:1px solid var(--line);grid-template-columns:repeat(5,1fr);padding:6px 4px env(safe-area-inset-bottom)}.mobilebar button{font-size:10px;padding:7px 2px;min-height:52px;background:transparent}.mobilebar button.active{color:var(--accent)}.top{align-items:flex-start}.cash{font-size:17px}.row{align-items:flex-start;flex-direction:column}.row .actions{width:100%;justify-content:flex-start}}@media(max-width:520px){.g4,.g3,.g2{grid-template-columns:1fr}.title h1{font-size:21px}.card{padding:13px}.vehicle{grid-template-columns:1fr}.row .actions button{flex:1}.toolbar>*{width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hide"></div>
<div id="toast" class="toast hide"></div>
<script>
(() => {
"use strict";
const KEY="cdmt-save-v1";
const brands=["Volter","Nordica","Raven","Aurelia","Vektor","Mistral","Kron","Falconer","Monarch","Ardent"];
const models=[
["Volter","V1","Compact",10500],["Volter","Atlas","SUV",18500],["Nordica","N3","Family",14500],["Nordica","Eon","Electric",22000],
["Raven","R4","Sport",26500],["Raven","Corsa","Performance",34000],["Aurelia","A6","Luxury",42000],["Vektor","VX","SUV",24000],
["Mistral","M2","Economy",9000],["Kron","K5","Premium",31000],["Falconer","F7","Sport",38000],["Monarch","M1","Luxury",52000],
["Ardent","Aero","Electric",28500],["Vektor","Cargo","Van",20500],["Mistral","Classic","Classic",17000],["Kron","Trail","SUV",27000]
];
const names=["Liam","Sophie","Noah","Emma","Lucas","Mila","Finn","Julia","Daan","Sara","Sem","Nora","Mats","Lotte","Bram","Evi"];
const customerTypes=["Budget buyer","Family buyer","Young driver","Enthusiast","Luxury buyer","First-time buyer","Business customer","SUV buyer","EV buyer","Practical commuter"];
const locations=[["Arnhem",4500,1.04],["Nijmegen",5200,1.08],["Ede",3900,0.97],["Apeldoorn",4700,1.02],["Utrecht",7800,1.18]];
const state0=()=>({
 day:1,week:1,month:1,year:1,season:"Spring",cash:50000,reputation:42,capacity:5,dealershipLevel:1,
 vehicles:[],staff:[{id:"s1",name:"Milan",role:"Salesperson",skill:2,level:1,salary:2200,morale:82}],
 transactions:[],customers:[],loans:[],upgrades:{parking:0,workshop:0,detail:0,marketing:0,analytics:0,staff:0},
 stats:{revenue:0,profit:0,sold:0,customers:0,expenses:0,bestDeal:0},
 marketTrend:"Balanced",event:null,location:"Arnhem",lastAction:"Welcome to your dealership.",
 achievements:[], selected:null
});
let s=load()||state0(), page="dashboard", market=[];
function money(n){return new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(Math.round(n||0))}
function pct(n){return Math.round(n)+"%"}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function id(p){return p+Math.random().toString(36).slice(2,9)}
function rand(a,b){return Math.random()*(b-a)+a}
function rint(a,b){return Math.floor(rand(a,b+1))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function save(){localStorage.setItem(KEY,JSON.stringify(s));toast("Spel opgeslagen")}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.remove("hide");clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.add("hide"),2200)}
function log(msg,amount=0,type="info"){s.transactions.unshift({day:s.day,msg,amount,type});s.transactions=s.transactions.slice(0,80)}
function vehicle(){const m=pick(models),year=rint(2015,2025),mileage=rint(8000,180000);const age=2026-year;const base=m[3]*(1-age*.045)*(1-Math.min(mileage,180000)/180000*.28);const cond=rint(45,96);const demand=rint(35,92);const risk=clamp(100-cond+rint(-8,15),5,70);const marketValue=Math.max(2500,base*(.86+cond/500)*(0.82+demand/300));const purchase=Math.max(1800,marketValue*rand(.63,.91));return {id:id("v"),brand:m[0],model:m[1],body:m[2],year,mileage,condition:cond,demand,risk,purchasePrice:Math.round(purchase),marketValue:Math.round(marketValue),askingPrice:Math.round(marketValue*rand(.98,1.1)),repairCost:0,detailCost:0,transportCost:rint(250,700),days:0,status:"Market",color:pick(["Black","White","Silver","Blue","Red","Grey"]),fuel:pick(["Petrol","Petrol","Diesel","Hybrid","Electric"]),transmission:pick(["Manual","Automatic"]),trim:pick(["Base","Comfort","Sport","Premium"]),options:rint(2,8),history:risk>45?"Unclear history":"Clean history"}}
function seedMarket(){market=Array.from({length:14},vehicle)}
seedMarket();
function activeLoans(){return s.loans.reduce((a,l)=>a+l.remaining,0)}
function monthlyExpenses(){return s.staff.reduce((a,e)=>a+e.salary,0)+locations.find(x=>x[0]===s.location)[1]+s.loans.reduce((a,l)=>a+l.payment,0)}
function netWorth(){return s.cash+s.vehicles.reduce((a,v)=>a+v.marketValue,0)-activeLoans()}
function pageTitle(){return ({dashboard:"Dashboard",dealership:"Dealership",inventory:"Inventory",market:"Vehicle Market",customers:"Customers",sales:"Sales",staff:"Staff",finances:"Finances",upgrades:"Upgrades",expansion:"Expansion",company:"Company",settings:"Settings"})[page]}
function nav(){return ["dashboard","dealership","inventory","market","customers","sales","staff","finances","upgrades","expansion","company","settings"]}
function render(){
const root=document.getElementById("app");
root.innerHTML='<div class="app"><aside class="side"><div class="brand">CDMT</div><div class="sub">CAR DEALERSHIP MANAGER TYCOON</div><div class="nav">'+nav().map(n=>'<button class="'+(page===n?"active":"")+'" data-nav="'+n+'">'+icon(n)+' '+label(n)+'</button>').join("")+'</div><div class="save"><button class="primary" data-action="advance">Advance 1 day</button><button data-action="save">Save game</button></div></aside><main class="main"><div class="top"><div class="title"><h1>'+pageTitle()+'</h1><p>Day '+s.day+' · Week '+s.week+' · Year '+s.year+' · '+s.season+' · '+s.location+'</p></div><div class="cash">'+money(s.cash)+'</div></div><div id="content">'+view()+"</div></main><nav class="mobilebar">'+["dashboard","market","inventory","sales","more"].map(n=>'<button data-mobile="'+n+'" class="'+((n==="more"?["staff","finances","upgrades","expansion","company","settings"].includes(page):page===n)?"active":"")+'">'+(n==="more"?"☰ More":icon(n)+" "+label(n))+'</button>').join("")+'</nav></div>';
root.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>{page=b.dataset.nav;render()}));
root.querySelectorAll("[data-mobile]").forEach(b=>b.addEventListener("click",()=>{const n=b.dataset.mobile;if(n==="more")page="staff";else page=n;render()}));
root.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>act(b.dataset.action,b.dataset.id)));
root.querySelectorAll("[data-buy]").forEach(b=>b.addEventListener("click",()=>buyMarket(b.dataset.buy)));
root.querySelectorAll("[data-sell]").forEach(b=>b.addEventListener("click",()=>openSale(b.dataset.sell)));
root.querySelectorAll("[data-upgrade]").forEach(b=>b.addEventListener("click",()=>upgrade(b.dataset.upgrade)));
root.querySelectorAll("[data-hire]").forEach(b=>b.addEventListener("click",()=>hire()));
root.querySelectorAll("[data-expand]").forEach(b=>b.addEventListener("click",()=>expand(b.dataset.expand)));
root.querySelectorAll("[data-work]").forEach(b=>b.addEventListener("click",()=>prepare(b.dataset.work)));
const search=document.getElementById("search"); if(search) search.addEventListener("input",()=>{window.__search=search.value;render()});
}
function icon(n){return ({dashboard:"▦",dealership:"⌂",inventory:"▤",market:"◈",customers:"♙",sales:"€",staff:"♟",finances:"◫",upgrades:"⬆",expansion:"◎",company:"◆",settings:"⚙"})[n]||""}
function label(n){return ({dashboard:"Dashboard",dealership:"Dealership",inventory:"Inventory",market:"Market",customers:"Customers",sales:"Sales",staff:"Staff",finances:"Finances",upgrades:"Upgrades",expansion:"Expansion",company:"Company",settings:"Settings",more:"More"})[n]}
function metric(a,b,c){return '<div class="card metric"><div class="label">'+a+'</div><div class="value">'+b+'</div><div class="small muted">'+c+'</div></div>'}
function view(){switch(page){case"dashboard":return dashboard();case"dealership":return dealership();case"inventory":return inventory();case"market":return marketView();case"customers":return customers();case"sales":return sales();case"staff":return staff();case"finances":return finances();case"upgrades":return upgrades();case"expansion":return expansion();case"company":return company();default:return settings()}}
function dashboard(){const inv=s.vehicles.filter(v=>v.status==="Listed"||v.status==="Ready"||v.status==="Repairing");const recent=s.transactions.slice(0,5);return '<div class="grid g4">'+metric("Cash",money(s.cash),"Available capital")+metric("Company value",money(netWorth()),"Assets minus debt")+metric("Inventory",inv.length+" / "+s.capacity,"Vehicles on lot")+metric("Reputation",pct(s.reputation),"Customer trust")+'</div><div class="grid g3"><div class="card"><div class="section">Today</div><div class="kpi"><span>Revenue</span><b>'+money(s.transactions.filter(x=>x.day===s.day&&x.amount>0).reduce((a,x)=>a+x.amount,0))+'</b></div><div class="kpi"><span>Expenses</span><b>'+money(s.transactions.filter(x=>x.day===s.day&&x.amount<0).reduce((a,x)=>a-x.amount,0))+'</b></div><div class="kpi"><span>Vehicles sold</span><b>'+s.stats.sold+'</b></div><div class="kpi"><span>Monthly fixed costs</span><b>'+money(monthlyExpenses())+'</b></div></div><div class="card"><div class="section">Market pulse</div><div class="notice event"><b>'+s.marketTrend+'</b><br><span class="small muted">'+(s.event||"The used-car market is stable. Look for underpriced inventory.")+'</span></div><div class="spark">'+Array.from({length:12},(_,i)=>'<i style="height:'+rint(20,90)+'%"></i>').join("")+'</div></div><div class="card"><div class="section">Recent activity</div>'+(recent.length?recent.map(x=>'<div class="kpi"><span>'+x.msg+'</span><b class="'+(x.amount>=0?"goodtxt":"badtxt")+'">'+(x.amount?money(x.amount):"")+'</b></div>').join(""):'<div class="muted">No activity yet.</div>')+'</div></div><div class="section">Your next move</div><div class="grid g3"><div class="card"><b>1. Find a bargain</b><p class="muted">Open Market and compare purchase price, market value, risk and demand.</p><button class="primary" data-action="go-market">Open Market</button></div><div class="card"><b>2. Prepare inventory</b><p class="muted">Inspect, repair and detail cars before listing them.</p><button data-action="go-inventory">Manage Inventory</button></div><div class="card"><b>3. Make the sale</b><p class="muted">Customers appear as you advance time. Negotiate to protect your margin.</p><button data-action="go-sales">Open Sales</button></div></div>'}
function dealership(){return '<div class="card"><div class="grid g3"><div><div class="small muted">Dealership level</div><div class="offer">Level '+s.dealershipLevel+'</div><div class="bar"><i style="width:'+clamp(s.reputation,0,100)+'%"></i></div></div><div><div class="small muted">Lot capacity</div><div class="offer">'+s.capacity+'</div></div><div><div class="small muted">Monthly fixed costs</div><div class="offer">'+money(monthlyExpenses())+'</div></div></div></div><div class="section">Dealership floor</div><div class="grid g3"><div class="card"><h3>Showroom</h3><p class="muted">Your customer-facing sales floor. Better upgrades increase conversion.</p><span class="tag">Level '+s.dealershipLevel+'</span><span class="tag">Reputation '+pct(s.reputation)+'</span></div><div class="card"><h3>Workshop</h3><p class="muted">Mechanics can turn risky bargains into profitable stock.</p><span class="tag">Workshop '+s.upgrades.workshop+'</span><span class="tag">Detail '+s.upgrades.detail+'</span></div><div class="card"><h3>Parking</h3><p class="muted">Every vehicle consumes a spot until sold.</p><span class="tag">'+s.vehicles.length+' vehicles</span><span class="tag">'+s.capacity+' spots</span></div></div><div class="section">Recent sales</div>'+salesTable() }
function inventory(){let q=window.__search||"";let arr=s.vehicles.filter(v=>[v.brand,v.model,v.status,v.body].join(" ").toLowerCase().includes(q.toLowerCase()));return '<div class="toolbar"><input id="search" placeholder="Search vehicles..." value="'+esc(q)+'"><button data-action="clear-search">Clear</button><button data-action="advance">Advance day</button></div><div class="card">'+(arr.length?'<div class="list">'+arr.map(vehicleRow).join("")+'</div>':'<div class="empty">No vehicles match your search.<br>Visit Market to buy inventory.</div>')+'</div>'}
function vehicleRow(v){const cost=v.purchasePrice+v.repairCost+v.detailCost+v.transportCost;const margin=v.askingPrice-cost;return '<div class="row"><div class="vehicle"><div><h3>'+v.brand+' '+v.model+' <span class="tag">'+v.year+'</span></h3><div class="small muted">'+v.trim+' · '+v.body+' · '+v.fuel+' · '+v.transmission+' · '+v.mileage.toLocaleString("nl-NL")+' km</div><span class="tag">Condition '+v.condition+'</span><span class="tag">Demand '+v.demand+'</span><span class="tag">Risk '+v.risk+'</span><span class="tag">'+v.status+'</span></div><div><div class="price">'+money(v.askingPrice)+'</div><div class="'+(margin>=0?"goodtxt":"badtxt")+' small">Est. margin '+money(margin)+'</div></div></div><div class="actions">'+(v.status==="Market"?'<button data-action="inspect" data-id="'+v.id+'">Inspect</button>':"")+(v.status==="Inspected"||v.status==="Ready"?'<button class="good" data-work="detail" data-id="'+v.id+'">Detail €'+money(350+v.detailCost*0.2)+'</button><button class="primary" data-action="list" data-id="'+v.id+'">List</button>':"")+(v.status==="Listed"?'<button class="primary" data-sell="'+v.id+'">Sell</button>':"")+(v.status==="Inspected"||v.status==="Listed"?'<button data-work="repair" data-id="'+v.id+'">Repair</button>':"")+'</div></div>'}
function marketView(){return '<div class="toolbar"><button class="primary" data-action="refresh-market">Refresh opportunities</button><button data-action="advance">Advance 1 day</button><span class="notice small">Market: <b>'+s.marketTrend+'</b></span></div><div class="grid g2">'+market.map(v=>'<div class="card"><div class="vehicle"><div><h3>'+v.brand+' '+v.model+'</h3><div class="small muted">'+v.year+' · '+v.body+' · '+v.fuel+' · '+v.mileage.toLocaleString("nl-NL")+' km</div><p><span class="tag">Condition '+v.condition+'</span><span class="tag">Demand '+v.demand+'</span><span class="tag">Risk '+v.risk+'</span></p><p class="muted small">'+v.history+' · '+v.color+' · '+v.trim+'</p></div><div><div class="price">'+money(v.purchasePrice)+'</div><div class="small muted">Market '+money(v.marketValue)+'</div></div></div><div class="actions"><button class="primary" data-buy="'+v.id+'" '+(s.vehicles.length>=s.capacity||s.cash<v.purchasePrice+v.transportCost?"disabled":"")+'>'+((s.vehicles.length>=s.capacity)?"Lot full":"Buy for "+money(v.purchasePrice+v.transportCost))+'</button></div></div>').join("")+'</div>'}
function customers(){return '<div class="grid g3"><div class="card">'+metric("Leads today",s.customers.length,"Active customer opportunities")+metric("Reputation",pct(s.reputation),"Higher reputation improves conversion")+'</div><div class="card"><h3>Customer mix</h3>'+customerTypes.slice(0,6).map((x,i)=>'<div class="kpi"><span>'+x+'</span><b>'+rint(4,18)+'%</b></div>').join("")+'</div><div class="card"><h3>Demand drivers</h3><p class="muted">Price, condition, presentation, market demand, reputation and customer preferences determine interest.</p><button class="primary" data-action="advance">Generate next day</button></div></div><div class="section">Active leads</div><div class="card">'+(s.customers.length?s.customers.map(c=>'<div class="row"><div><b>'+c.name+'</b> <span class="tag">'+c.type+'</span><div class="small muted">Budget '+money(c.budget)+' · Wants '+c.preference+' · Interest '+c.interest+'</div></div><button class="primary" data-action="lead-sale" data-id="'+c.id+'">Open sales</button></div>').join(""):'<div class="empty">No active customers. Advance time to attract buyers.</div>')+'</div>'}
function sales(){return '<div class="card"><div class="section">Sales desk</div><p class="muted">Open a listed vehicle to start an interactive negotiation. Customers have hidden willingness-to-pay.</p></div><div class="section">Vehicles ready for a deal</div><div class="card">'+(s.vehicles.filter(v=>v.status==="Listed").length?s.vehicles.filter(v=>v.status==="Listed").map(vehicleRow).join(""):'<div class="empty">No listed vehicles. Inspect and prepare a car first.</div>')+'</div><div class="section">Recent deals</div>'+salesTable()}
function salesTable(){let sold=s.transactions.filter(x=>x.type==="sale").slice(0,8);return '<div class="card"><table><thead><tr><th>Day</th><th>Deal</th><th>Result</th></tr></thead><tbody>'+(sold.length?sold.map(x=>'<tr><td>'+x.day+'</td><td>'+x.msg+'</td><td class="goodtxt">'+money(x.amount)+'</td></tr>').join(""):'<tr><td colspan="3" class="muted">No completed sales yet.</td></tr>')+'</tbody></table></div>'}
function staff(){return '<div class="toolbar"><button class="primary" data-hire>Hire random candidate (€500)</button></div><div class="grid g2">'+s.staff.map(e=>'<div class="card"><div class="row"><div><h3>'+e.name+' <span class="tag">Lv '+e.level+'</span></h3><div class="muted">'+e.role+' · Skill '+e.skill+'/10</div><div class="bar"><i style="width:'+e.morale+'%"></i></div><div class="small muted">Morale '+e.morale+'% · Salary '+money(e.salary)+'/mo</div></div><div><button data-action="train" data-id="'+e.id+'">Train €750</button></div></div></div>').join("")+'</div>'}
function finances(){return '<div class="grid g4">'+metric("Lifetime revenue",money(s.stats.revenue),"Gross sales")+metric("Lifetime profit",money(s.stats.profit),"After recorded costs")+metric("Debt",money(activeLoans()),"Outstanding loans")+metric("Assets",money(s.vehicles.reduce((a,v)=>a+v.marketValue,0)),"Current inventory value")+'</div><div class="section">Loans</div><div class="card"><button class="primary" data-action="loan" '+(s.loans.length>=3?"disabled":"")+'>Take €10,000 loan</button><p class="small muted">24% total interest over 12 months. Monthly payment is deducted automatically.</p>'+(s.loans.length?s.loans.map(l=>'<div class="kpi"><span>€10,000 loan · '+l.months+' months left</span><b>'+money(l.remaining)+'</b></div>').join(""):'')+'</div><div class="section">Transactions</div><div class="card"><table><thead><tr><th>Day</th><th>Description</th><th>Amount</th></tr></thead><tbody>'+s.transactions.slice(0,20).map(x=>'<tr><td>'+x.day+'</td><td>'+x.msg+'</td><td class="'+(x.amount>=0?"goodtxt":"badtxt")+'">'+(x.amount?money(x.amount):"—")+'</td></tr>').join("")+'</tbody></table></div>'}
function upgrades(){const defs=[["parking","Parking capacity",s.upgrades.parking,4000,["+5 capacity","Each level +5 spaces"]],["workshop","Workshop",s.upgrades.workshop,6500,["Lower repair cost","Faster preparation"]],["detail","Detailing",s.upgrades.detail,5000,["Higher presentation","Better sale conversion"]],["marketing","Marketing",s.upgrades.marketing,3500,["More customer leads","Higher visibility"]],["analytics","Market analytics",s.upgrades.analytics,8000,["Better market clues","Lower purchase risk"]],["staff","Staff facilities",s.upgrades.staff,4500,["More staff capacity","Higher morale"]]];return '<div class="grid g3">'+defs.map(d=>'<div class="card"><h3>'+d[1]+'</h3><div class="offer">Lv '+d[2]+'</div><p class="muted">'+d[4][0]+'. '+d[4][1]+'.</p><button class="primary" data-upgrade="'+d[0]+'" '+(s.cash<d[3]*(d[2]+1)?"disabled":"")+'>'+money(d[3]*(d[2]+1))+' Upgrade</button></div>').join("")+'</div>'}
function expansion(){return '<div class="grid g2">'+locations.map(l=>'<div class="card"><h3>'+l[0]+'</h3><div class="kpi"><span>Monthly rent</span><b>'+money(l[1])+'</b></div><div class="kpi"><span>Market factor</span><b>'+l[2].toFixed(2)+'×</b></div><p class="muted">Opening a second location requires €35,000 and dealership level 4.</p><button class="primary" data-expand="'+l[0]+'" '+(s.dealershipLevel<4||s.cash<35000||s.location===l[0]?"disabled":"")+'>'+ (s.location===l[0]?"Current location":"Open location")+'</button></div>').join("")+'</div><div class="section">Expansion path</div><div class="card"><p>Level 1: Small used-car lot → Level 2: Local dealership → Level 3: Established dealership → Level 4: Large dealership → Level 5+: dealer group.</p><button data-action="level-up" '+(s.reputation<50||s.dealershipLevel>=7?"disabled":"")+'>'+ (s.dealershipLevel>=7?"Maximum level":"Upgrade dealership level · requires 50 reputation")+'</button></div>'}
function company(){return '<div class="grid g4">'+metric("Company value",money(netWorth()),"Cash + inventory − debt")+metric("Vehicles sold",s.stats.sold,"Lifetime deliveries")+metric("Customers",s.stats.customers,"Generated leads")+metric("Best deal",money(s.stats.bestDeal),"Highest profit")+'</div><div class="section">Achievements</div><div class="grid g2">'+["First Sale","€100K Company Value","100 Vehicles Sold","€1M Company","Second Dealership","Perfect Review","Biggest Deal","Automotive Empire"].map(a=>'<div class="card '+(s.achievements.includes(a)?"successline":"")+'"><b>'+a+'</b><div class="small muted">'+(s.achievements.includes(a)?"Unlocked":"Keep playing to unlock")+'</div></div>').join("")+'</div>'}
function settings(){return '<div class="card"><h3>Game settings</h3><p class="muted">Your save is stored locally in this browser.</p><div class="toolbar"><button data-action="save" class="primary">Save now</button><button data-action="new-save">New game</button><button data-action="reset" class="danger">Reset local save</button></div></div><div class="card"><h3>About</h3><p>Car Dealership Manager Tycoon is a self-contained browser game. No online service is required for the core gameplay.</p><p class="small muted">Version 0.1 · Offline-first web build</p></div>'}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function act(a,vid){
if(a==="save")return save();
if(a==="advance")return advance();
if(a==="go-market"){page="market";return render()} if(a==="go-inventory"){page="inventory";return render()} if(a==="go-sales"){page="sales";return render()}
if(a==="clear-search"){window.__search="";return render()} if(a==="refresh-market"){seedMarket();return render()}
if(a==="inspect"){const v=s.vehicles.find(x=>x.id===vid);if(!v)return;if(v.status!=="Market")return;v.status="Inspected";v.condition=clamp(v.condition+rint(-4,3),25,99);if(v.risk>50)v.repairCost=rint(900,4200);s.lastAction="Inspection complete for "+v.brand+" "+v.model;toast("Inspection complete");return render()}
if(a==="list"){const v=s.vehicles.find(x=>x.id===vid);if(!v)return;v.status="Listed";v.days=0;s.lastAction=v.brand+" "+v.model+" is now listed.";toast("Vehicle listed");return render()}
if(a==="train"){const e=s.staff.find(x=>x.id===vid);if(!e||s.cash<750)return toast("Not enough cash");s.cash-=750;e.skill=clamp(e.skill+1,1,10);e.level=clamp(Math.ceil(e.skill/2),1,5);e.morale=clamp(e.morale+6,0,100);log("Training: "+e.name,-750,"expense");return render()}
if(a==="loan"){if(s.cash<0)return;const l={remaining:12400,payment:1034,months:12};s.loans.push(l);s.cash+=10000;log("Business loan +€10,000",10000,"loan");return render()}
if(a==="level-up"){if(s.reputation<50||s.dealershipLevel>=7)return;s.dealershipLevel++;s.capacity+=5;s.reputation=clamp(s.reputation+4,0,100);s.lastAction="Dealership upgraded to level "+s.dealershipLevel;toast("Dealership level increased");return render()}
if(a==="new-save"){if(confirm("Start a new dealership? Current local save will be replaced.")){s=state0();seedMarket();page="dashboard";save();render()}}
if(a==="reset"){if(confirm("Delete the local save permanently?")){localStorage.removeItem(KEY);s=state0();seedMarket();page="dashboard";render();toast("Save reset")}}
if(a==="lead-sale"){page="sales";render()}
}
function buyMarket(idv){const v=market.find(x=>x.id===idv);if(!v||s.vehicles.length>=s.capacity)return toast("No parking space");const total=v.purchasePrice+v.transportCost;if(s.cash<total)return toast("Not enough cash");s.cash-=total;v.status="Market";s.vehicles.push({...v,status:"Market",purchasePrice:v.purchasePrice,days:0});market=market.filter(x=>x.id!==idv);log("Bought "+v.brand+" "+v.model,-total,"purchase");s.lastAction="New inventory acquired.";render()}
function prepare(type,vid){const v=s.vehicles.find(x=>x.id===vid);if(!v)return;if(type==="repair"){const cost=Math.max(450,Math.round((v.repairCost||700)*(1-s.upgrades.workshop*.07)));if(s.cash<cost)return toast("Not enough cash");s.cash-=cost;v.repairCost+=cost;v.condition=clamp(v.condition+12+s.upgrades.workshop*2,0,100);v.risk=clamp(v.risk-10,0,100);v.status="Ready";log("Repair: "+v.brand+" "+v.model,-cost,"expense")}else{const cost=Math.max(250,Math.round(350*(1-s.upgrades.detail*.08)));if(s.cash<cost)return toast("Not enough cash");s.cash-=cost;v.detailCost+=cost;v.condition=clamp(v.condition+5,0,100);v.askingPrice+=Math.round(500+v.condition*2);v.status="Ready";log("Detailing: "+v.brand+" "+v.model,-cost,"expense")}render()}
function openSale(vid){const v=s.vehicles.find(x=>x.id===vid);if(!v)return;const types=customerTypes;const c={id:id("c"),name:pick(names),type:pick(types),budget:Math.round(v.marketValue*rand(.82,1.15)),interest:clamp(rint(52,96)+s.upgrades.marketing*4,20,100),preference:v.body,skill:rint(1,8)};s.customers.unshift(c);s.customers=s.customers.slice(0,12);s.selected={vehicle:vid,customer:c.id,offer:Math.round(v.askingPrice*rand(.82,.97)),round:1};modalSale()}
function modalSale(){const v=s.vehicles.find(x=>x.id===s.selected.vehicle),c=s.customers.find(x=>x.id===s.selected.customer);if(!v||!c)return;const offer=s.selected.offer;document.getElementById("modal").classList.remove("hide");document.getElementById("modal").innerHTML='<div class="modalbox"><div class="top"><div><h2>'+c.name+' · '+c.type+'</h2><p class="muted">'+v.brand+' '+v.model+' · Asking '+money(v.askingPrice)+'</p></div><button data-close>×</button></div><div class="grid g2"><div class="dealbox"><div class="small muted">Current customer offer</div><div class="offer">'+money(offer)+'</div><div class="small">Interest '+c.interest+'% · Budget clue '+money(c.budget)+'</div></div><div class="card"><div class="kpi"><span>Market value</span><b>'+money(v.marketValue)+'</b></div><div class="kpi"><span>Your cost basis</span><b>'+money(v.purchasePrice+v.transportCost+v.repairCost+v.detailCost)+'</b></div><div class="kpi"><span>Round</span><b>'+s.selected.round+'/3</b></div></div></div><div class="section">Choose your response</div><div class="toolbar"><button class="primary" data-deal="accept">Accept '+money(offer)+'</button><button data-deal="counter">Counter</button><button data-deal="discount">Offer discount</button><button class="danger" data-deal="reject">Reject</button></div><p class="small muted">The customer’s true willingness-to-pay is hidden. Better condition, reputation and salesperson skill improve your odds.</p></div>';document.querySelector("[data-close]").addEventListener("click",closeModal);document.querySelectorAll("[data-deal]").forEach(b=>b.addEventListener("click",()=>deal(b.dataset.deal)))}
function closeModal(){document.getElementById("modal").classList.add("hide");s.selected=null}
function deal(action){const v=s.vehicles.find(x=>x.id===s.selected.vehicle),c=s.customers.find(x=>x.id===s.selected.customer);if(!v||!c)return closeModal();const skill=Math.max(...s.staff.filter(e=>e.role==="Salesperson").map(e=>e.skill),1);const trueMax=Math.round(v.marketValue*(.9+c.interest/800+skill/300));let offer=s.selected.offer;if(action==="accept"){return completeSale(v,c,offer)}
if(action==="counter"){const next=Math.round(Math.min(v.askingPrice,trueMax)*(.97+skill/500));s.selected.offer=next;s.selected.round++;if(next<=trueMax&&Math.random()<.72){toast("Customer is considering your counter");}else if(s.selected.round>=3){toast("Customer walked away");return closeModal()}return modalSale()}
if(action==="discount"){const next=Math.round(offer*.96);s.selected.offer=next;s.selected.round++;if(Math.random()<.9)return modalSale();return closeModal()}
if(action==="reject"){closeModal();toast("Customer left without a deal")}}
function completeSale(v,c,price){const cost=v.purchasePrice+v.transportCost+v.repairCost+v.detailCost;const profit=price-cost;s.cash+=price;s.stats.revenue+=price;s.stats.profit+=profit;s.stats.sold++;s.stats.bestDeal=Math.max(s.stats.bestDeal,profit);s.reputation=clamp(s.reputation+(profit>0?1:0),0,100);v.status="Sold";s.vehicles=s.vehicles.filter(x=>x.id!==v.id);s.customers=s.customers.filter(x=>x.id!==c.id);log("Sold "+v.brand+" "+v.model+" to "+c.name,profit,"sale");s.lastAction="Sale completed for "+money(profit)+" profit.";if(!s.achievements.includes("First Sale"))s.achievements.push("First Sale");if(netWorth()>=100000&&!s.achievements.includes("€100K Company Value"))s.achievements.push("€100K Company Value");if(profit>5000&&!s.achievements.includes("Biggest Deal"))s.achievements.push("Biggest Deal");closeModal();toast("Sale completed · "+money(profit)+" profit");render()}
function hire(){if(s.cash<500)return toast("Not enough cash");if(s.staff.length>=3+s.upgrades.staff)return toast("Upgrade staff facilities first");const role=pick(["Salesperson","Mechanic","Detailer","Buyer"]);const e={id:id("e"),name:pick(names),role,skill:rint(2,5),level:1,salary:rint(1900,2800),morale:rint(65,92)};s.cash-=500;s.staff.push(e);log("Hired "+e.name,-500,"expense");render()}
function upgrade(key){const base={parking:4000,workshop:6500,detail:5000,marketing:3500,analytics:8000,staff:4500}[key],lv=s.upgrades[key],cost=base*(lv+1);if(s.cash<cost)return;s.cash-=cost;s.upgrades[key]++;if(key==="parking")s.capacity+=5;log("Upgrade: "+key,-cost,"expense");toast("Upgrade purchased");render()}
function expand(loc){if(s.dealershipLevel<4||s.cash<35000)return;s.cash-=35000;s.location=loc;s.reputation=clamp(s.reputation+3,0,100);if(!s.achievements.includes("Second Dealership"))s.achievements.push("Second Dealership");log("Opened dealership in "+loc,-35000,"expense");render()}
function advance(){s.day++;if(s.day%7===0){s.week++;s.staff.forEach(e=>e.morale=clamp(e.morale+rint(-3,4),0,100));}
if(s.day%30===0){s.month++;s.year=Math.floor((s.month-1)/12)+1;s.season=["Spring","Summer","Autumn","Winter"][(s.month-1)%4];const exp=monthlyExpenses();s.cash-=exp;s.stats.expenses+=exp;log("Monthly operating costs",-exp,"expense");s.loans.forEach(l=>{l.remaining=Math.max(0,l.remaining-l.payment);l.months--;});s.loans=s.loans.filter(l=>l.remaining>0)}
s.vehicles.forEach(v=>{if(v.status==="Listed")v.days++;if(v.status==="Market")v.days++});
if(Math.random()<.24){const events=[["SUV boom","SUV demand rises this week."],["EV boom","Electric vehicle interest increases."],["Fuel price change","Fuel prices shift buyer preferences."],["Used-car shortage","Supply is tight; good stock is more valuable."],["Economic downturn","Customers become more price-sensitive."],["Auction opportunity","Wholesale supply briefly improves."]];const e=pick(events);s.marketTrend=e[0];s.event=e[1];if(e[0]==="Economic downturn")s.reputation=clamp(s.reputation-1,0,100);else s.reputation=clamp(s.reputation+1,0,100)}
if(Math.random()<.65){const listed=s.vehicles.filter(v=>v.status==="Listed");if(listed.length){const v=pick(listed);const c={id:id("c"),name:pick(names),type:pick(customerTypes),budget:Math.round(v.marketValue*rand(.82,1.12)),interest:clamp(rint(50,92)+s.upgrades.marketing*5,20,100),preference:v.body,skill:rint(1,8)};s.customers.unshift(c);s.customers=s.customers.slice(0,12);s.stats.customers++;}}
market=market.map(v=>({...v,marketValue:Math.max(1500,Math.round(v.marketValue*(1+rand(-.018,.018))))}));if(Math.random()<.35)market.push(vehicle());market=market.slice(0,18);if(s.cash<0)s.lastAction="Cash is negative. Sell inventory or take a loan to recover.";save();render()}
document.addEventListener("click",e=>{if(e.target.matches("[data-close]"))closeModal()});
render();
})();
</script>
</body>
</html>
