name: Build Pages Files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Publish generated web files to repository root
        run: |
          set -e
          cp dist/web/index.html ./index.html
          cp dist/web/manifest.webmanifest ./manifest.webmanifest
          cp dist/web/sw.js ./sw.js
          rm -rf ./icons
          cp -R dist/web/icons ./icons
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest sw.js icons
          git diff --cached --quiet || git commit -m "build: publish game to Pages root"
          git push
