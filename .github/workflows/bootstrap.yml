from pathlib import Path
def R(p): return Path(p).read_text()
def W(p,s): Path(p).write_text(s)

p='src/data/buildcats.ts'
s=R(p).replace("import type { ObjDef } from './lot';\nimport { ZONE_BY_CODE } from './lot';","import type { ObjDef } from './lot';\nimport { OBJECTS, ZONE_BY_CODE } from './lot';\nimport type { Lot, LotObject, ZoneCode } from '../sim/types';")
W(p,s)

p='src/ui/world/build.ts'
s=R(p)
s=s.replace("import { BUILD_TABS, BUILD_TAB_BY_ID, LEGACY_TAB, PANEL_TABS, tabsOf } from '../../data/buildcats';","import { BUILD_TABS, BUILD_TAB_BY_ID, BUILD_CONTEXTS, BUILD_CONTEXT_BY_ID, LEGACY_TAB, PANEL_TABS, tabsOf } from '../../data/buildcats';")
s=s.replace("import type { BuildTabId } from '../../data/buildcats';","import type { BuildContextId, BuildTabId } from '../../data/buildcats';")
s=s.replace("  category: () => string;\n  setCategory: (c: string) => void;","  category: () => string;\n  setCategory: (c: string) => void;\n  context: () => BuildContextId;\n  setContext: (c: BuildContextId) => void;")
anchor="  const current = (LEGACY_TAB[cat] ?? cat) as BuildTabId;\n  for (const t of BUILD_TABS) {\n    const count = t.test ? OBJECTS.filter((d) => !d.hidden && t.test!(d)).length : 0;"
replace="  const current = (LEGACY_TAB[cat] ?? cat) as BuildTabId;\n  const visibleTabs = new Set<BuildTabId>(ctxDef.tabs);\n  visibleTabs.add('structure');\n  for (const t of BUILD_TABS.filter((tab) => visibleTabs.has(tab.id))) {\n    const count = t.test ? OBJECTS.filter((d) => !d.hidden && t.test!(d)).length : 0;"
s=s.replace(anchor,replace)
needle="  root.appendChild(swipeSheet(h('div', { class: 'bp-modes', role: 'group', aria: { label: 'Build mode' } },"
pos=s.find(needle)
if pos<0: raise SystemExit('build mode anchor missing')
end=s.find("  const current =",pos)
block=s[pos:end]
context="""  const ctxId = host.context();
  const ctxDef = BUILD_CONTEXT_BY_ID[ctxId] ?? BUILD_CONTEXTS[0];
  const contextBar = h('div', { class: 'bp-contexts scroll-x', role: 'tablist', aria: { label: 'Build context' } });
  for (const c of BUILD_CONTEXTS) {
    contextBar.appendChild(h('button', {
      class: 'bp-context' + (c.id === ctxId ? ' active' : ''),
      data: { context: c.id },
      title: c.subtitle,
      aria: { label: c.name + ': ' + c.subtitle, pressed: String(c.id === ctxId) },
      on: { click: () => { haptic(6); host.setContext(c.id); } },
    }, icon(c.icon, 17), h('span', { text: c.name })));
  }
  root.appendChild(h('div', { class: 'bp-context-head' },
    h('div', { class: 'bp-context-title' },
      h('strong', { text: ctxDef.name }),
      h('span', { text: ctxDef.subtitle }),
      h('button', { class: 'bp-context-rooms', title: 'Rooms & areas', aria: { label: 'Rooms and areas' }, on: { click: () => { haptic(6); host.setCategory('zones'); } } }, icon('garage', 14), h('span', { text: 'Rooms' }))),
    contextBar));
"""
s=s[:end]+block+context+s[end:]
