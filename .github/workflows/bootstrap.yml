name: Bootstrap Dealersim Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import and rebuild Dealersim
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          git clone --depth 1 https://github.com/kevinspotify2006-glitch/Dealersim.git source
          rsync -a --exclude='.git' --exclude='.github/workflows/**' source/ ./

          cat > src/ui/world/camera.ts <<'EOF'
/**
 * Camera over the dealership tile grid.
 *
 * The normal game uses a flat top-down projection. Build Mode can switch to an
 * oblique/isometric presentation so the dealership reads more like a modern
 * 3D management game while keeping the existing tile coordinates, placement
 * and simulation completely intact.
 */
export type Projection = 'topdown' | 'iso';

export class Camera {
  x = 15;
  y = 10;
  zoom = 24;
  width = 800;
  height = 600;
  min = 7;
  max = 90;
  bounds = { x0: -6, y0: -6, x1: 36, y1: 30 };
  projection: Projection = 'topdown';

  setProjection(mode: Projection): void {
    this.projection = mode;
    this.clamp();
  }

  private basis(): { ax: number; ay: number; bx: number; by: number } {
    const z = this.zoom;
    return { ax: z * 0.84, ay: z * 0.42, bx: -z * 0.84, by: z * 0.42 };
  }

  toScreen(wx: number, wy: number): { x: number; y: number } {
    if (this.projection === 'topdown') {
      return { x: (wx - this.x) * this.zoom + this.width / 2, y: (wy - this.y) * this.zoom + this.height / 2 };
    }
    const b = this.basis();
    const dx = wx - this.x;
    const dy = wy - this.y;
    return {
      x: dx * b.ax + dy * b.bx + this.width / 2,
      y: dx * b.ay + dy * b.by + this.height / 2,
    };
  }

  toWorld(sx: number, sy: number): { x: number; y: number } {
    if (this.projection === 'topdown') {
      return { x: (sx - this.width / 2) / this.zoom + this.x, y: (sy - this.height / 2) / this.zoom + this.y };
    }
    const b = this.basis();
    const sxn = sx - this.width / 2;
    const syn = sy - this.height / 2;
    const det = b.ax * b.by - b.bx * b.ay;
    const dx = (sxn * b.by - b.bx * syn) / det;
    const dy = (b.ax * syn - sxn * b.ay) / det;
    return { x: dx + this.x, y: dy + this.y };
  }

  panBy(dxPx: number, dyPx: number): void {
    if (this.projection === 'topdown') {
      this.x -= dxPx / this.zoom;
      this.y -= dyPx / this.zoom;
    } else {
      const b = this.basis();
      const det = b.ax * b.by - b.bx * b.ay;
      const dx = (dxPx * b.by - b.bx * dyPx) / det;
      const dy = (b.ax * dyPx - dxPx * b.ay) / det;
      this.x -= dx;
      this.y -= dy;
    }
    this.clamp();
  }

  zoomAt(factor: number, sx: number, sy: number): void {
    const before = this.toWorld(sx, sy);
    this.zoom = Math.max(this.min, Math.min(this.max, this.zoom * factor));
    const after = this.toWorld(sx, sy);
    this.x += before.x - after.x;
    this.y += before.y - after.y;
    this.clamp();
  }

  fit(x0: number, y0: number, x1: number, y1: number, pad = { top: 60, bottom: 90, left: 20, right: 20 }): void {
    const w = Math.max(1, this.width - pad.left - pad.right);
    const h = Math.max(1, this.height - pad.top - pad.bottom);
    const worldW = Math.max(1, x1 - x0);
    const worldH = Math.max(1, y1 - y0);
    if (this.projection === 'topdown') {
      this.zoom = Math.max(this.min, Math.min(this.max, Math.min(w / worldW, h / worldH)));
    } else {
      const projectedW = (worldW + worldH) * 0.84;
      const projectedH = (worldW + worldH) * 0.42;
      this.zoom = Math.max(this.min, Math.min(this.max, Math.min(w / projectedW, h / projectedH)));
    }
    const cx = (x0 + x1) / 2;
    const cy = (y0 + y1) / 2;
    this.x = cx - (pad.left - pad.right) / 2 / this.zoom;
    this.y = cy - (pad.top - pad.bottom) / 2 / this.zoom;
    this.clamp();
  }

  resize(width: number, height: number): void {
    this.width = Math.max(1, width);
    this.height = Math.max(1, height);
    this.clamp();
  }

  setBounds(x0: number, y0: number, x1: number, y1: number): void {
    this.bounds = { x0, y0, x1, y1 };
    this.clamp();
  }

  clamp(): void {
    const b = this.bounds;
    const halfW = this.width / 2 / this.zoom;
    const halfH = this.height / 2 / this.zoom;
    const extra = this.projection === 'iso' ? 1.35 : 0.5;
    this.x = Math.max(b.x0 - halfW * extra, Math.min(b.x1 + halfW * extra, this.x));
    this.y = Math.max(b.y0 - halfH * extra, Math.min(b.y1 + halfH * extra, this.y));
  }
}
