new="  g.setTransform(1, 0, 0, 1, 0, 0);\n  g.fillStyle = s.build ? '#0b1117' : '#1b2a1f';\n  g.fillRect(0, 0, W, H);\n  const z = cam.zoom * dpr;\n  const iso = cam.projection === 'iso';\n  if (iso) { const ax = z * 0.84, ay = z * 0.42, bx = -z * 0.84, by = z * 0.42; const ox = W / 2 - cam.x * ax - cam.y * bx; const oy = H / 2 - cam.x * ay - cam.y * by; g.setTransform(ax, ay, bx, by, ox, oy); }\n  else { const ox = W / 2 - cam.x * z; const oy = H / 2 - cam.y * z; g.setTransform(z, 0, 0, z, ox, oy); }\n  const ex = iso ? (cam.width + cam.height) / cam.zoom * 0.75 + 5 : cam.width / 2 / cam.zoom + 2;\n  const ey = iso ? (cam.width + cam.height) / cam.zoom * 0.75 + 5 : cam.height / 2 / cam.zoom + 2;\n  const view = { x0: cam.x - ex, y0: cam.y - ey, x1: cam.x + ex, y1: cam.y + ey };"
s=s.replace(old,new).replace("    g.globalAlpha = 0.18;","    g.globalAlpha = iso ? 0.10 : 0.18;",1)
