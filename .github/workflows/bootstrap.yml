new="      const obj = objectAt(w, false) ?? objectAt(w);\n      if (obj) { const picked = loc.lot.objects.find((x) => x.id === obj); const context = picked ? contextForObject(picked, loc.lot) : contextForZone(zoneAt(loc.lot, Math.max(0, Math.floor(w.x)), Math.max(0, Math.floor(w.y)))); if (context) ui.context = context; select({ kind: 'object', id: obj }, w); }\n      else { const tx = Math.floor(w.x), ty = Math.floor(w.y); if (tx >= 0 && ty >= 0 && tx < loc.lot.w && ty < loc.lot.h) { const context = contextForZone(zoneAt(loc.lot, tx, ty)); if (context) { ui.context = context; ui.category = context === 'showroom' ? 'showroom' : context === 'workshop' ? 'service' : context === 'office' ? 'staff' : context === 'storage' ? 'storage' : context === 'outdoor' ? 'parking' : 'customers'; ui.search = ''; paintBuild(); } } ui.selected = null; closePop(); }\n      return;"
