p='src/ui/views/world.ts'
s=R(p)
s=s.replace("import { buildPalette, buildStats, setTracker } from '../world/build';","import { buildPalette, buildStats, setTracker } from '../world/build';\nimport { contextForZone, contextForObject } from '../../data/buildcats';")
s=s.replace("  sheet: SheetSize;\n}","  sheet: SheetSize;\n  context: string;\n}")
