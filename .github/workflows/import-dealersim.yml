name: Import Dealersim

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4

      - name: Import Dealersim source
        run: |
          set -e
          git clone --depth 1 https://github.com/kevinspotify2006-glitch/Dealersim.git source
          rsync -a --exclude='.git' --exclude='.github' source/ ./
          rm -rf source

      - name: Commit imported game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Dealersim game source" || exit 0
          git push
